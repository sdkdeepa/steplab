# nginx settings for the StepLab Docker image.
# Replaces the image's default site config (/etc/nginx/conf.d/default.conf).

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Smaller downloads for text files.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain;

  # Built app files have a fingerprint in their names, so browsers can keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Lab files: show as text in the browser, and always check for a newer version.
  location ~* \.md$ {
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The app manifest (installing StepLab as an app). Always check for a newer version.
  location ~* \.webmanifest$ {
    default_type "application/manifest+json";
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Everything else, including the service worker (sw.js) and friendly addresses like /sample and /sample-template:
  # serve the file if it exists, otherwise hand the address to the StepLab app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
