<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>StepLab: Turn one markdown file into a step-by-step codelab</title>
    <meta name="description" content="Write Step 1, Step 2, Step 3 in markdown and get an interactive codelab with progress, copyable code and one-file HTML export. Free and open source. Works on the web, in VS Code and Antigravity." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- Share previews (LinkedIn, Slack, X, WhatsApp...). %STEPLAB_URL% is filled in from src/config.ts at build time. -->
    <link rel="canonical" href="%STEPLAB_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StepLab" />
    <meta property="og:url" content="%STEPLAB_URL%" />
    <meta property="og:title" content="StepLab: Turn one markdown file into a step-by-step codelab" />
    <meta property="og:description" content="Interactive codelabs from plain markdown, with progress, copyable code and one-file HTML export. Free, open source, no server. Web, VS Code and Antigravity." />
    <meta property="og:image" content="%STEPLAB_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StepLab: Turn one markdown file into a step-by-step codelab" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StepLab: Turn one markdown file into a step-by-step codelab" />
    <meta name="twitter:description" content="Interactive codelabs from plain markdown. Free, open source, no server. Web, VS Code and Antigravity." />
    <meta name="twitter:image" content="%STEPLAB_URL%og-image.png" />
    <script>
      try {
        var t = localStorage.getItem('steplab:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
