# StepLab on Netlify. Deploy this repo as its own Netlify site,
# then proxy deepasubramanian.dev/steplab to it (see README → "Host it on your own domain").
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache built JS/CSS (their names change on every build); always re-check the page and labs.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Friendly addresses (/sample-template, /sample) load the app. Real files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
