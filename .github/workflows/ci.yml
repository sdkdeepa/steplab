# Checks every pull request before it can be merged into main.
# The job names below ("Website", "Extension", "Docker image", "Quality gate") are
# the checks to mark as required in the main branch ruleset.
name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # The extension reuses the website's code in src/, so it needs the root packages too.
      - run: npm ci
      - run: npm ci
        working-directory: extension
      - run: npm run build
        working-directory: extension
      # Makes sure the extension still packages into a .vsix (it isn't published from here).
      - run: npx vsce package --no-dependencies --out steplab-check.vsix
        working-directory: extension

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Builds the image (which also runs the tests) without publishing it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Unit and end-to-end tests, then AI Quality Gate decides PASS / WARN / BLOCK
  # from their results (quality-gate.yml). Internal only: nothing here changes the
  # website, the extension or the Docker image, and no AI is involved.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm run test:ci
      # The steps below run even if the unit tests failed, so the gate sees every result.
      - name: Build the site
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Install the test browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        if: ${{ !cancelled() }}
        run: npm run test:e2e
      - name: Quality gate
        if: ${{ !cancelled() }}
        uses: sdkdeepa/ai-quality-gate@v1
      - name: Keep Playwright traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
