# Builds the StepLab Docker image and publishes it to GitHub's container registry:
#   ghcr.io/sdkdeepa/steplab
#
# Runs when you push a version tag, for example:
#   git tag v0.1.4 && git push origin v0.1.4
# That publishes the tags 0.1.4, 0.1 and latest.
#
# You can also run it by hand: Actions → Publish Docker image → Run workflow.
# A manual run publishes only a test tag like sha-1a2b3c4 (no "latest").
#
# The GitHub Pages deploy (deploy.yml) is separate and keeps running on every push to main.
name: Publish Docker image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets one build make images for both Intel/AMD (amd64) and Apple Silicon/ARM (arm64).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Signs in to ghcr.io with this repo's built-in token. No secret to create.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name and tags from the git tag (v0.1.4 → 0.1.4, 0.1, latest).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=StepLab
            org.opencontainers.image.description=Codelab-style labs from Markdown
            org.opencontainers.image.licenses=MIT

      # Runs the Dockerfile (which runs npm test and npm run build), then pushes the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
