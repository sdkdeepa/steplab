# Builds StepLab and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Safety switch for the offline app: set the repository variable STEPLAB_PWA to "off"
      # (Settings → Secrets and variables → Actions → Variables) and run this workflow.
      # It publishes a service worker that removes itself and every StepLab cache from
      # everyone's browser. Delete the variable and deploy again to turn the app back on.
      - run: npm run build
        env:
          STEPLAB_PWA: ${{ vars.STEPLAB_PWA }}
      # GitHub Pages has no rewrite rules. Serving the app as 404.html makes
      # /sample and /sample-template load the app instead of an error page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5